<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cargando</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet.fullscreen/Control.FullScreen.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen/Control.FullScreen.css" />

  <script>
    (function() {
      localStorage.clear();
      // 1. DETECCIÓN DE IDIOMA PARA EL TITLE
      const userLang = navigator.language || navigator.userLanguage;
      const langCode = userLang.split('-')[0]; // Extrae 'es', 'en' o 'pt'

      const translations = {
        'es': 'Cargando...',
        'en': 'Loading...',
        'pt': 'Carregando...'
      };

      // Aplicar el título según el idioma detectado (por defecto español)
      document.title = translations[langCode] || translations['es'];

      // 2. LÓGICA DE DARK MODE
      // Establece el valor inicial basado en la preferencia del sistema
      const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      localStorage.setItem('darkMode', isDarkMode ? "true" : "false");

      // Escucha cambios en tiempo real en el tema del sistema
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        localStorage.setItem('darkMode', e.matches ? 'true' : 'false');
      });
    })();
  </script>

  <script src="/config.js"></script>
</head>

<body class="bgSection" >
